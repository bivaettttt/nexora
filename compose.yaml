name: nexora
x-app: &app
  build: .
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
    interval: 3s
    timeout: 3s
    retries: 30
x-app-env: &app-env
  SERVICE_KEY: nexora-local-service
  AMQP_URL: amqp://nexora:nexora-local-broker@rabbitmq:5672/%2F
  LAB_MODE: ${NEXORA_LAB_MODE:-0}
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora-local-db
      POSTGRES_DB: nexora
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-services.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U nexora -d nexora"]
      interval: 2s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: nexora
      RABBITMQ_DEFAULT_PASS: nexora-local-broker
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  crm:
    <<: *app
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+psycopg://crm:crm-local-db@postgres/crm
      DB_COMPONENT: crm
    command: ["/bin/sh", "-ec", "alembic upgrade head && exec uvicorn nexora.source:crm --host 0.0.0.0"]
  erp:
    <<: *app
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+psycopg://erp:erp-local-db@postgres/erp
      DB_COMPONENT: erp
    command: ["/bin/sh", "-ec", "alembic upgrade head && exec uvicorn nexora.erp:app --host 0.0.0.0"]
  billing:
    <<: *app
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+psycopg://billing:billing-local-db@postgres/billing
      DB_COMPONENT: billing
    command: ["/bin/sh", "-ec", "alembic upgrade head && exec uvicorn nexora.source:billing --host 0.0.0.0"]

  api:
    <<: *app
    environment: &core-env
      <<: *app-env
      DATABASE_URL: postgresql+psycopg://integration:integration-local-db@postgres/integration
      DB_COMPONENT: core
      BROKER_PASSWORD: nexora-local-broker
      VIEWER_KEY: ${NEXORA_VIEWER_KEY:-nexora-local-viewer}
      OPERATOR_KEY: ${NEXORA_OPERATOR_KEY:-nexora-local-operator}
      ADMIN_KEY: ${NEXORA_ADMIN_KEY:-nexora-local-admin}
    command: ["/bin/sh", "-ec", "alembic upgrade head && exec uvicorn nexora.api:app --host 0.0.0.0"]
  worker:
    build: .
    environment: *core-env
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["python", "-m", "nexora.worker"]

volumes:
  postgres:
  rabbitmq:
